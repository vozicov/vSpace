{% load static %}{% comment %}
The search bar and its drawer. Typing fills the drawer (search.js); Enter, or no JavaScript, goes to the
full results page. Optional: q (what is already typed).
{% endcomment %}
<div class="search-box" data-search-box data-url="{% url 'search' %}">
    <form class="search" role="search" action="{% url 'search' %}" method="get">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.75" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5L20.5 20.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="search" name="q" value="{{ q|default:'' }}" placeholder="Search people, posts, tweets" aria-label="Search" autocomplete="off" spellcheck="false" maxlength="100" aria-controls="search-drawer" aria-expanded="false" data-input>
        <button type="button" class="search-clear" data-clear aria-label="Clear search" hidden>&times;</button>
    </form>
    <div class="drawer" id="search-drawer" data-drawer aria-live="polite"></div>
</div>
<script src="{% static 'js/search.js' %}" defer></script>
