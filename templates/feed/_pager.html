{% if page_obj.has_other_pages %}
<div class="pager">
    <span>{% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}{% if kind %}&kind={{ kind }}{% endif %}">← Newer</a>{% endif %}</span>
    <span class="muted">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    <span>{% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}{% if kind %}&kind={{ kind }}{% endif %}">Older →</a>{% endif %}</span>
</div>
{% endif %}
